apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rhel9-webserver-simple
  namespace: webserver
  labels:
    app: webserver
  annotations:
    kubevirt.io/vm.useEmulation: "true"
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: rhel9-webserver-simple
        vm.kubevirt.io/name: rhel9-webserver-simple
      annotations:
        kubevirt.io/vm.useEmulation: "true"
    spec:
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
            model: virtio
        machine:
          type: pc-q35-rhel9.4.0
        memory:
          guest: 2Gi
        resources:
          requests:
            memory: 2Gi
            cpu: "1"
      networks:
      - name: default
        pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/containerdisks/centos-stream:9
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            user: centos
            password: redhat123
            chpasswd: { expire: False }
            ssh_pwauth: True
            package_update: true
            packages:
              - httpd
              - curl
              - wget
              - vim
            runcmd:
              - systemctl enable httpd
              - systemctl start httpd
              - echo "<h1>Welcome to CentOS Stream 9 Web Server</h1>" > /var/www/html/index.html
              - echo "<p>Server started on $(date)</p>" >> /var/www/html/index.html
              - echo "<p>Hostname: $(hostname)</p>" >> /var/www/html/index.html
              - echo "<p>IP Address: $(hostname -I)</p>" >> /var/www/html/index.html
              - chown apache:apache /var/www/html/index.html
              - systemctl restart httpd
