apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-frontend
  namespace: angular-frontend
  labels:
    app: angular-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: angular-frontend
  template:
    metadata:
      labels:
        app: angular-frontend
    spec:
      containers:
      - name: angular-app
        image: registry.redhat.io/ubi9/nginx-120:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: app-content
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      initContainers:
      - name: angular-builder
        image: registry.redhat.io/ubi9/nodejs-18:latest
        command: ["/bin/sh"]
        args: ["-c", "cd /app && npm install -g @angular/cli && npm install && ng build --prod && cp -r dist/angular-app/* /usr/share/nginx/html/"]
        volumeMounts:
        - name: app-source
          mountPath: /app
        - name: app-content
          mountPath: /usr/share/nginx/html
        - name: angular-config
          mountPath: /app/angular.json
          subPath: angular.json
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: nginx-config
        configMap:
          name: angular-config
      - name: angular-config
        configMap:
          name: angular-config
      - name: app-source
        configMap:
          name: angular-source
      - name: app-content
        emptyDir: {}
