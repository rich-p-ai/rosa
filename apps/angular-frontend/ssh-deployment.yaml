apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-frontend-ssh
  namespace: angular-frontend
  labels:
    app: angular-frontend-ssh
    app.kubernetes.io/name: angular-frontend-ssh
    app.kubernetes.io/part-of: web-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-frontend-ssh
  template:
    metadata:
      labels:
        app: angular-frontend-ssh
    spec:
      serviceAccountName: default
      containers:
      - name: ssh-server
        image: registry.redhat.io/ubi9/ubi:latest
        ports:
        - containerPort: 22
          name: ssh
        env:
        - name: SSH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: angular-frontend-ssh-secret
              key: password
        - name: SSH_USERNAME
          value: "developer"
        command:
        - /bin/bash
        - -c
        - |
          # Install SSH server and required packages
          dnf update -y
          dnf install -y openssh-server passwd sudo vim nano curl git
          
          # Configure SSH
          sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/#PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
          sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          echo "ChallengeResponseAuthentication yes" >> /etc/ssh/sshd_config
          echo "UsePAM yes" >> /etc/ssh/sshd_config
          
          # Create developer user
          useradd -m -s /bin/bash $SSH_USERNAME
          echo "$SSH_USERNAME:$SSH_PASSWORD" | chpasswd
          usermod -aG wheel $SSH_USERNAME
          echo "$SSH_USERNAME ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/$SSH_USERNAME
          
          # Setup workspace directory
          mkdir -p /home/$SSH_USERNAME/workspace/src
          chown -R $SSH_USERNAME:$SSH_USERNAME /home/$SSH_USERNAME/workspace
          
          # Create sample Angular files for editing
          cat > /home/$SSH_USERNAME/workspace/src/app.component.ts << 'EOF'
import { Component } from '@angular/core';

@Component({
  selector: 'app-root',
  template: `
    <div class="app-container">
      <header class="app-header">
        <h1>Angular Frontend - ROSA Deployment</h1>
        <p>Edit this file via SSH to customize your Angular application!</p>
        <p>SSH Access: ssh developer@angular-frontend-ssh.angular-frontend.svc.cluster.local</p>
      </header>
      <main class="editable-content">
        <h2>{{ title }}</h2>
        <p>{{ message }}</p>
      </main>
    </div>
  `,
  styles: [`
    .app-container {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .app-header {
      background-color: #dd0031;
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .editable-content {
      margin: 20px 0;
      padding: 15px;
      border: 2px dashed #dd0031;
      border-radius: 8px;
      text-align: center;
    }
  `]
})
export class AppComponent {
  title = 'Angular Frontend with SSH Access';
  message = 'This content can be modified through SSH access.';
}
EOF
          
          cat > /home/$SSH_USERNAME/workspace/src/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angular Frontend - SSH Editable</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .header { color: #dd0031; text-align: center; }
        .info { background: #ffe6e6; padding: 15px; border-radius: 4px; margin: 20px 0; }
        .code { background: #f5f5f5; padding: 10px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header">Angular Frontend with SSH Access</h1>
        <div class="info">
            <h3>SSH Access Information:</h3>
            <div class="code">ssh developer@angular-frontend-ssh-service:22</div>
            <p>Use the provided password to access the development environment.</p>
        </div>
        <div class="info">
            <h3>Editable Files:</h3>
            <ul>
                <li>/home/developer/workspace/src/app.component.ts</li>
                <li>/home/developer/workspace/src/index.html</li>
                <li>/home/developer/workspace/src/styles.css</li>
            </ul>
        </div>
        <p>This page can be edited via SSH access to customize your Angular application.</p>
    </div>
</body>
</html>
EOF
          
          cat > /home/$SSH_USERNAME/workspace/src/styles.css << 'EOF'
/* Angular Frontend Styles - Edit via SSH */
.app-container {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 20px;
}

.app-header {
  background-color: #dd0031;
  color: white;
  padding: 20px;
  border-radius: 8px;
  text-align: center;
}

.editable-content {
  margin: 20px 0;
  padding: 15px;
  border: 2px dashed #dd0031;
  border-radius: 8px;
  text-align: center;
}

.ssh-info {
  background-color: #ffe6e6;
  padding: 15px;
  border-radius: 8px;
  margin: 20px 0;
}
EOF
          
          chown -R $SSH_USERNAME:$SSH_USERNAME /home/$SSH_USERNAME/workspace
          
          # Generate SSH host keys
          ssh-keygen -A
          
          # Start SSH daemon
          exec /usr/sbin/sshd -D
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: true
        livenessProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: workspace-volume
          mountPath: /home/developer/workspace
        - name: ssh-config-volume
          mountPath: /etc/ssh/sshd_config.d
      volumes:
      - name: workspace-volume
        emptyDir: {}
      - name: ssh-config-volume
        emptyDir: {}
