apiVersion: v1
kind: Service
metadata:
  name: angular-frontend-ssh-service
  namespace: angular-frontend
  labels:
    app: angular-frontend-ssh
    app.kubernetes.io/name: angular-frontend-ssh
    app.kubernetes.io/part-of: web-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  type: ClusterIP
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    protocol: TCP
  selector:
    app: angular-frontend-ssh
