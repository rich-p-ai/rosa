apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-backend-ssh
  namespace: nodejs-backend
  labels:
    app: nodejs-backend-ssh
    app.kubernetes.io/name: nodejs-backend-ssh
    app.kubernetes.io/part-of: web-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-backend-ssh
  template:
    metadata:
      labels:
        app: nodejs-backend-ssh
    spec:
      serviceAccountName: default
      containers:
      - name: ssh-server
        image: registry.redhat.io/ubi9/ubi:latest
        ports:
        - containerPort: 22
          name: ssh
        env:
        - name: SSH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nodejs-backend-ssh-secret
              key: password
        - name: SSH_USERNAME
          value: "developer"
        command:
        - /bin/bash
        - -c
        - |
          # Install SSH server and required packages
          dnf update -y
          dnf install -y openssh-server passwd sudo vim nano curl git
          
          # Configure SSH
          sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/#PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
          sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          echo "ChallengeResponseAuthentication yes" >> /etc/ssh/sshd_config
          echo "UsePAM yes" >> /etc/ssh/sshd_config
          
          # Create developer user
          useradd -m -s /bin/bash $SSH_USERNAME
          echo "$SSH_USERNAME:$SSH_PASSWORD" | chpasswd
          usermod -aG wheel $SSH_USERNAME
          echo "$SSH_USERNAME ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/$SSH_USERNAME
          
          # Setup workspace directory
          mkdir -p /home/$SSH_USERNAME/workspace/src
          chown -R $SSH_USERNAME:$SSH_USERNAME /home/$SSH_USERNAME/workspace
          
          # Create sample Node.js files for editing
          cat > /home/$SSH_USERNAME/workspace/src/app.js << 'EOF'
const express = require('express');
const app = express();
const port = process.env.PORT || 3000;

// Middleware
app.use(express.json());
app.use(express.static('public'));

// Routes - Edit these via SSH access
app.get('/', (req, res) => {
  res.json({
    message: 'Node.js Backend - ROSA Deployment',
    ssh_access: 'ssh developer@nodejs-backend-ssh.nodejs-backend.svc.cluster.local',
    status: 'running',
    editable: 'This API can be modified through SSH access'
  });
});

app.get('/api/health', (req, res) => {
  res.json({
    status: 'healthy',
    timestamp: new Date().toISOString(),
    environment: 'ROSA cluster'
  });
});

app.get('/api/ssh-info', (req, res) => {
  res.json({
    ssh_service: 'nodejs-backend-ssh-service',
    ssh_port: 22,
    username: 'developer',
    workspace: '/home/developer/workspace/src',
    editable_files: [
      'app.js',
      'package.json',
      'routes/api.js'
    ]
  });
});

// Start server
app.listen(port, () => {
  console.log(`Node.js Backend with SSH access running on port ${port}`);
});

module.exports = app;
EOF
          
          cat > /home/$SSH_USERNAME/workspace/src/package.json << 'EOF'
{
