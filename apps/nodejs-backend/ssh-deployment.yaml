          mkdir -p /home/$SSH_USERNAME/workspace/src/routes
          cat > /home/$SSH_USERNAME/workspace/src/routes/api.js << 'EOF'
// API Routes - Edit via SSH access
const express = require('express');
const router = express.Router();

// User management routes
router.get('/users', (req, res) => {
  res.json({
    users: [
      { id: 1, name: 'John Doe', role: 'admin' },
      { id: 2, name: 'Jane Smith', role: 'user' }
    ],
    ssh_editable: true
  });
});

router.post('/users', (req, res) => {
  const { name, role } = req.body;
  res.json({
    message: 'User created successfully',
    user: { id: Date.now(), name, role },
    note: 'This endpoint can be modified via SSH'
  });
});

// Data processing routes
router.get('/data', (req, res) => {
  res.json({
    data: 'Sample data from Node.js backend',
    processed_at: new Date().toISOString(),
    ssh_access: 'Available for real-time editing'
  });
});

module.exports = router;
EOF
          
          cat > /home/$SSH_USERNAME/workspace/src/README.md << 'EOF'
# Node.js Backend with SSH Access

## SSH Access Information
- **Service**: nodejs-backend-ssh-service
- **Port**: 22
- **Username**: developer
- **Workspace**: /home/developer/workspace/src

## Editable Files
- `app.js` - Main application file
- `package.json` - Project configuration
- `routes/api.js` - API routes
- `public/` - Static files directory

## Usage
1. SSH into the container: `ssh developer@nodejs-backend-ssh-service:22`
2. Navigate to workspace: `cd /home/developer/workspace/src`
3. Edit files with vim/nano
4. Changes take effect immediately (restart if needed)

## API Endpoints
- `GET /` - Application info
- `GET /api/health` - Health check
- `GET /api/ssh-info` - SSH access information
- `GET /api/users` - User management
- `POST /api/users` - Create user
EOF
          
          chown -R $SSH_USERNAME:$SSH_USERNAME /home/$SSH_USERNAME/workspace
          
          # Generate SSH host keys
          ssh-keygen -A
          
          # Start SSH daemon
          exec /usr/sbin/sshd -D
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
