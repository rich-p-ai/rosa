          tcpSocket:
            port: 22
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: workspace-volume
          mountPath: /home/developer/workspace
        - name: ssh-config-volume
          mountPath: /etc/ssh/sshd_config.d
      volumes:
      - name: workspace-volume
        emptyDir: {}
      - name: ssh-config-volume
        emptyDir: {}
