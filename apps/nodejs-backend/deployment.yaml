apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-backend
  namespace: nodejs-backend
  labels:
    app: nodejs-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nodejs-backend
  template:
    metadata:
      labels:
        app: nodejs-backend
    spec:
      containers:
      - name: nodejs-app
        image: registry.redhat.io/ubi9/nodejs-18:latest
        ports:
        - containerPort: 3000
        command: ["/bin/sh"]
        args: ["-c", "cd /app && npm install && npm start"]
        volumeMounts:
        - name: app-source
          mountPath: /app
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nodejs-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: nodejs-secrets
              key: JWT_SECRET
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: nodejs-secrets
              key: API_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: app-source
        configMap:
          name: nodejs-config
