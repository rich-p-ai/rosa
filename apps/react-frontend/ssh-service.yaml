apiVersion: v1
kind: Service
metadata:
  name: react-frontend-ssh-service
  namespace: react-frontend
  labels:
    app: react-frontend
    service-type: ssh
spec:
  type: LoadBalancer
  ports:
  - name: ssh
    port: 22
    targetPort: 2222
    protocol: TCP
  selector:
    app: react-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
