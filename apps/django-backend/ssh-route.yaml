apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: django-backend-ssh-route
  namespace: django-backend
  labels:
    app: django-backend-ssh
    app.kubernetes.io/name: django-backend-ssh
    app.kubernetes.io/part-of: web-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    haproxy.router.openshift.io/timeout: "30s"
spec:
  to:
    kind: Service
    name: django-backend-ssh-service
    weight: 100
  port:
    targetPort: ssh
  wildcardPolicy: None
