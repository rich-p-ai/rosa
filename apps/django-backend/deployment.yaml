apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-backend
  namespace: django-backend
  labels:
    app: django-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-backend
  template:
    metadata:
      labels:
        app: django-backend
    spec:
      containers:
      - name: django-app
        image: registry.redhat.io/ubi9/python-311:latest
        ports:
        - containerPort: 8000
        command: ["/bin/bash"]
        args: ["-c", "cd /app && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 3 djangoapp.wsgi:application"]
        volumeMounts:
        - name: app-source
          mountPath: /app
        - name: media-storage
          mountPath: /app/media
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "djangoapp.settings"
        - name: DEBUG
          value: "False"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: django-secrets
              key: REDIS_URL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: app-source
        configMap:
          name: django-config
      - name: media-storage
        persistentVolumeClaim:
          claimName: django-media-pvc
