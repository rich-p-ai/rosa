    """SSH access information"""
    return Response({
        'ssh_service': 'django-backend-ssh-service',
        'ssh_port': 22,
        'username': 'developer',
        'workspace': '/home/developer/workspace/src',
        'editable_files': [
            'settings.py',
            'views.py',
            'urls.py',
            'models.py'
        ]
    })

@api_view(['GET', 'POST'])
def users_api(request):
    """User management API - editable via SSH"""
    if request.method == 'GET':
        return Response({
            'users': [
                {'id': 1, 'name': 'John Doe', 'role': 'admin'},
                {'id': 2, 'name': 'Jane Smith', 'role': 'user'}
            ],
            'ssh_editable': True,
            'note': 'This endpoint can be modified via SSH'
        })
    elif request.method == 'POST':
        data = request.data
        return Response({
            'message': 'User created successfully',
            'user': {
                'id': 999,
                'name': data.get('name', 'Unknown'),
                'role': data.get('role', 'user')
            },
            'ssh_note': 'This response can be customized via SSH'
        })

@api_view(['GET'])
def data_api(request):
    """Data processing API"""
    return Response({
        'data': 'Sample data from Django backend',
        'processed_at': str(timezone.now()),
        'ssh_access': 'Available for real-time editing',
        'framework': 'Django REST Framework'
    })
