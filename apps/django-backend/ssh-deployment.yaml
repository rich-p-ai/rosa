    'service': 'django-backend-ssh-service',
    'port': 22,
    'username': 'developer',
    'workspace': '/home/developer/workspace/src'
}
EOF
          
          cat > /home/$SSH_USERNAME/workspace/src/views.py << 'EOF'
"""
Django Views for SSH-Editable Backend
Edit these views via SSH to customize your API responses!
"""

from django.http import JsonResponse
from django.views.decorators.csrf import csrf_exempt
from django.views.decorators.http import require_http_methods
from rest_framework.decorators import api_view
from rest_framework.response import Response
import json

@api_view(['GET'])
def api_root(request):
    """Main API endpoint - editable via SSH"""
    return Response({
        'message': 'Django Backend - ROSA Deployment',
        'ssh_access': 'ssh developer@django-backend-ssh.django-backend.svc.cluster.local',
        'status': 'running',
        'editable': 'This API can be modified through SSH access',
        'endpoints': [
            '/api/',
            '/api/health/',
            '/api/ssh-info/',
            '/api/users/',
            '/api/data/'
        ]
    })

@api_view(['GET'])
def health_check(request):
