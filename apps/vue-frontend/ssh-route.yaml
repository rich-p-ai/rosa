apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vue-frontend-ssh-route
  namespace: vue-frontend
  labels:
    app: vue-frontend-ssh
    app.kubernetes.io/name: vue-frontend-ssh
    app.kubernetes.io/part-of: web-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    haproxy.router.openshift.io/timeout: "30s"
spec:
  to:
    kind: Service
    name: vue-frontend-ssh-service
    weight: 100
  port:
    targetPort: ssh
  wildcardPolicy: None
