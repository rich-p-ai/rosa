# SSH over HTTP/WebSocket using ttyd or similar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ssh-gateway
  namespace: ssh-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ssh-gateway
  template:
    metadata:
      labels:
        app: web-ssh-gateway
    spec:
      containers:
      - name: webssh
        image: huashengdun/webssh:latest
        ports:
        - containerPort: 8888
        env:
        - name: WORKERS
          value: "4"
---
apiVersion: v1
kind: Service
metadata:
  name: web-ssh-service
  namespace: ssh-gateway
spec:
  ports:
  - port: 8888
    targetPort: 8888
  selector:
    app: web-ssh-gateway
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web-ssh-route
  namespace: ssh-gateway
spec:
  host: ssh.webserver.p-ai.net
  to:
    kind: Service
    name: web-ssh-service
  port:
    targetPort: 8888
  tls:
    termination: edge
