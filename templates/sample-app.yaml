apiVersion: v1
kind: Namespace
metadata:
  name: sample-app
  labels:
    name: sample-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-openshift
  namespace: sample-app
  labels:
    app: hello-openshift
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-openshift
  template:
    metadata:
      labels:
        app: hello-openshift
    spec:
      containers:
      - name: hello-openshift
        image: openshift/hello-openshift:latest
        ports:
        - containerPort: 8080
        - containerPort: 8888
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: hello-openshift-service
  namespace: sample-app
  labels:
    app: hello-openshift
spec:
  selector:
    app: hello-openshift
  ports:
  - name: http-8080
    port: 8080
    targetPort: 8080
  - name: http-8888
    port: 8888
    targetPort: 8888
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hello-openshift-route
  namespace: sample-app
  labels:
    app: hello-openshift
spec:
  to:
    kind: Service
    name: hello-openshift-service
  port:
    targetPort: http-8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
