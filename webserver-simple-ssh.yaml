# Example: Convert your current webserver to the new simple access pattern

apiVersion: v1
kind: Namespace
metadata:
  name: ssh-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webssh-proxy
  namespace: ssh-gateway
  labels:
    app: webssh-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webssh-proxy
  template:
    metadata:
      labels:
        app: webssh-proxy
    spec:
      containers:
      - name: webssh
        image: huashengdun/webssh:latest
        ports:
        - containerPort: 8888
        env:
        - name: WORKERS
          value: "4"
        - name: POLICY
          value: "autoadd"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: webssh-service
  namespace: ssh-gateway
spec:
  ports:
  - port: 8888
    targetPort: 8888
    name: webssh
  selector:
    app: webssh-proxy
---
# Route for your current webserver project
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: webserver-ssh-route
  namespace: ssh-gateway
  labels:
    project: webserver
spec:
  host: webserver.ssh.p-ai.net
  to:
    kind: Service
    name: webssh-service
  port:
    targetPort: webssh
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
# SSH service for your webserver (add to webserver namespace)
apiVersion: v1
kind: Service
metadata:
  name: webserver-ssh
  namespace: webserver
  labels:
    app: webserver
    ssh-enabled: "true"
spec:
  type: ClusterIP
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    protocol: TCP
  selector:
    app: webserver
