apiVersion: v1
kind: ConfigMap
metadata:
  name: ssh-multiplexer-config
  namespace: ssh-gateway
data:
  haproxy.cfg: |
    global
        daemon
        log stdout local0
    
    defaults
        mode tcp
        timeout connect 5000ms
        timeout client 50000ms
        timeout server 50000ms
        log global
    
    frontend ssh_frontend
        bind *:2222
        # Route based on SNI or custom logic
        default_backend ssh_backend
    
    backend ssh_backend
        balance roundrobin
        # Add servers dynamically based on project
        server webserver1 rhel9-webserver-1.webserver:22 check
        server webserver2 rhel9-webserver-2.webserver:22 check
        # ... add more as needed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-multiplexer
  namespace: ssh-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssh-multiplexer
  template:
    metadata:
      labels:
        app: ssh-multiplexer
    spec:
      containers:
      - name: haproxy
        image: haproxy:2.8
        ports:
        - containerPort: 2222
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
      volumes:
      - name: config
        configMap:
          name: ssh-multiplexer-config
