apiVersion: v1
kind: Service
metadata:
  name: rhel9-webserver-nodeport
  namespace: webserver
  labels:
    app: webserver
    service-type: nodeport
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  selector:
    app: webserver
---
apiVersion: v1
kind: Service
metadata:
  name: rhel9-webserver-loadbalancer
  namespace: webserver
  labels:
    app: webserver
    service-type: loadbalancer
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: webserver
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rhel9-webserver-route
  namespace: webserver
  labels:
    app: webserver
spec:
  to:
    kind: Service
    name: rhel9-webserver-loadbalancer
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
