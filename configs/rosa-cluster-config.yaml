# ROSA Cluster Configuration Template
cluster:
  name: "my-rosa-cluster"
  region: "us-east-1"
  version: "4.14"
  compute:
    machine_type: "m5.xlarge"
    replicas: 3
    min_replicas: 3
    max_replicas: 6
  networking:
    machine_cidr: "10.0.0.0/16"
    service_cidr: "172.30.0.0/16"
    pod_cidr: "10.128.0.0/14"
  availability_zones:
    - "us-east-1a"
    - "us-east-1b"
    - "us-east-1c"
