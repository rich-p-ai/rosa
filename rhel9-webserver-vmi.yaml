apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: rhel9-webserver-vmi
  namespace: webserver
  labels:
    app: webserver
    vm.kubevirt.io/name: rhel9-webserver-vmi
  annotations:
    kubevirt.io/vm.useEmulation: "true"
spec:
  domain:
    cpu:
      cores: 2
      sockets: 1
      threads: 1
    devices:
      autoattachPodInterface: false
      autoattachSerialConsole: true
      autoattachGraphicsDevice: true
      networkInterfaceMultiqueue: true
      rng: {}
      disks:
      - name: rootdisk
        disk:
          bus: virtio
      - name: cloudinitdisk
        disk:
          bus: virtio
      interfaces:
      - name: default
        masquerade: {}
        model: virtio
    features:
      acpi: {}
    firmware:
      bootloader:
        efi:
          secureBoot: false
    machine:
      type: pc-q35-rhel9.4.0
    memory:
      guest: 4Gi
    resources:
      requests:
        memory: 4Gi
        cpu: 1500m
      limits:
        memory: 4Gi
        cpu: 1500m
  evictionStrategy: LiveMigrate
  nodeSelector:
    node.kubernetes.io/instance-type: m5n.xlarge
  networks:
  - name: default
    pod: {}
  terminationGracePeriodSeconds: 180
  volumes:
  - name: rootdisk
    persistentVolumeClaim:
      claimName: rhel9-webserver-rootdisk
  - name: cloudinitdisk
    cloudInitNoCloud:
      userData: |
        #cloud-config
        user: admin
        password: redhat123
        chpasswd: { expire: False }
        ssh_pwauth: True
        package_update: true
        packages:
          - httpd
          - curl
          - wget
          - vim
          - firewalld
        runcmd:
          - systemctl enable httpd
          - systemctl start httpd
          - systemctl enable firewalld
          - systemctl start firewalld
          - firewall-cmd --permanent --add-service=http
          - firewall-cmd --permanent --add-service=https
          - firewall-cmd --permanent --add-service=ssh
          - firewall-cmd --reload
          - echo "<h1>Welcome to RHEL 9 Web Server (Direct VMI)</h1>" > /var/www/html/index.html
          - echo "<p>Server started on $(date)</p>" >> /var/www/html/index.html
          - echo "<p>Hostname: $(hostname)</p>" >> /var/www/html/index.html
          - echo "<p>IP Address: $(hostname -I)</p>" >> /var/www/html/index.html
          - echo "<p>Running on m5n.xlarge with software emulation</p>" >> /var/www/html/index.html
          - chown apache:apache /var/www/html/index.html
          - systemctl restart httpd
