apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-bastion
  namespace: ssh-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssh-bastion
  template:
    metadata:
      labels:
        app: ssh-bastion
    spec:
      containers:
      - name: ssh-bastion
        image: linuxserver/openssh-server:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: PASSWORD_ACCESS
          value: "true"
        - name: USER_NAME
          value: "admin"
        ports:
        - containerPort: 2222
        volumeMounts:
        - name: ssh-config
          mountPath: /config
      volumes:
      - name: ssh-config
        persistentVolumeClaim:
          claimName: ssh-bastion-config
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-bastion-nlb
  namespace: ssh-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - port: 22
    targetPort: 2222
    protocol: TCP
  selector:
    app: ssh-bastion
