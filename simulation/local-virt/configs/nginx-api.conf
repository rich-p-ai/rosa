server {
    listen 80;
    server_name openshift-api-sim;
    
    location /api/v1 {
        return 200 '{"kind":"APIVersions","versions":["v1"],"serverAddressByClientCIDRs":[{"clientCIDR":"0.0.0.0/0","serverAddress":"openshift-api-sim:8443"}]}';
        add_header Content-Type application/json;
    }
    
    location /apis/kubevirt.io {
        return 200 '{"kind":"APIGroup","name":"kubevirt.io","versions":[{"groupVersion":"kubevirt.io/v1","version":"v1"}],"preferredVersion":{"groupVersion":"kubevirt.io/v1","version":"v1"}}';
        add_header Content-Type application/json;
    }
    
    location /apis/cdi.kubevirt.io {
        return 200 '{"kind":"APIGroup","name":"cdi.kubevirt.io","versions":[{"groupVersion":"cdi.kubevirt.io/v1beta1","version":"v1beta1"}],"preferredVersion":{"groupVersion":"cdi.kubevirt.io/v1beta1","version":"v1beta1"}}';
        add_header Content-Type application/json;
    }
    
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
    
    location / {
        return 200 '{"status":"OpenShift Virtualization Simulation API","version":"4.14","virtualization":"enabled"}';
        add_header Content-Type application/json;
    }
}
