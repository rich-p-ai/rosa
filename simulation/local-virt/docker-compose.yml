version: '3.8'

services:
  # Simulated OpenShift Control Plane
  openshift-api:
    image: nginx:alpine
    container_name: openshift-api-sim
    ports:
      - "8443:80"
    volumes:
      - ./configs/nginx-api.conf:/etc/nginx/conf.d/default.conf
    networks:
      - openshift-sim
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Simulated Virtualization Operator
  virt-operator:
    image: alpine:latest
    container_name: virt-operator-sim
    command: |
      sh -c "
        echo 'OpenShift Virtualization Operator Simulation Starting...'
        echo 'Monitoring for Virtual Machine requests...'
        while true; do
          echo '[$(date)] Virtualization operator healthy - managing VMs'
          sleep 30
        done
      "
    networks:
      - openshift-sim
    depends_on:
      - openshift-api

  # Simulated Linux Server VM 1
  linux-server-1:
    image: alpine:latest
    container_name: linux-server-1-sim
    hostname: linux-server-1
    command: |
      sh -c "
        apk add --no-cache iproute2 curl iperf3
        echo 'Linux Server 1 - Simulating VM networking tests'
        echo 'IP: 10.1.1.10'
        while true; do
          echo '[$(date)] Linux Server 1 - Network services running'
          sleep 60
        done
      "
    networks:
      openshift-sim:
        ipv4_address: 10.1.1.10
    cap_add:
      - NET_ADMIN
    depends_on:
      - virt-operator

  # Simulated Linux Server VM 2
  linux-server-2:
    image: alpine:latest
    container_name: linux-server-2-sim
    hostname: linux-server-2
    command: |
      sh -c "
        apk add --no-cache iproute2 curl iperf3
        echo 'Linux Server 2 - Simulating VM networking tests'
        echo 'IP: 10.1.1.20'
        while true; do
          echo '[$(date)] Linux Server 2 - Network services running'
          sleep 60
        done
      "
    networks:
      openshift-sim:
        ipv4_address: 10.1.1.20
    cap_add:
      - NET_ADMIN
    depends_on:
      - virt-operator

  # Network Testing Tools Container
  network-tester:
    image: nicolaka/netshoot
    container_name: network-tester
    hostname: network-tester
    command: |
      sh -c "
        echo 'Network Testing Tools Ready'
        echo 'Use: docker exec -it network-tester bash'
        echo 'Available tools: ping, traceroute, nmap, iperf3, tcpdump'
        tail -f /dev/null
      "
    networks:
      openshift-sim:
        ipv4_address: 10.1.1.100
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - linux-server-1
      - linux-server-2

networks:
  openshift-sim:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.1.0/24
          gateway: 10.1.1.1

volumes:
  virt-data:
    driver: local
