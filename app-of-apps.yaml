apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-applications-app-of-apps
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: web-applications
    app.kubernetes.io/part-of: rosa-deployment
spec:
  project: default
  source:
    repoURL: https://github.com/rich-p-ai/apps.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
